<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset="0.55" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a3d" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff9a3d" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <circle cx="220" cy="160" r="160" fill="#ff6a3d" opacity="0.22" filter="url(#blur)"/>
  <circle cx="1020" cy="520" r="220" fill="#ff9a3d" opacity="0.14" filter="url(#blur)"/>

  <rect x="70" y="70" width="1060" height="490" rx="28" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" />
  <rect x="90" y="90" width="1020" height="450" rx="22" fill="rgba(0,0,0,0)" stroke="rgba(255,255,255,0.06)"/>

  <rect x="110" y="120" width="10" height="390" rx="5" fill="url(#accent)"/>

  <text x="145" y="190" font-family="system-ui, -apple-system, Segoe UI, Inter, Arial, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Akın Karadaş
  </text>
  <text x="145" y="238" font-family="system-ui, -apple-system, Segoe UI, Inter, Arial, sans-serif" font-size="26" font-weight="600" fill="rgba(255,255,255,0.82)">
    Kurumsal Yazılım Çözümleri • ERP • CRM • Üretim Takibi
  </text>

  <text x="145" y="312" font-family="system-ui, -apple-system, Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="rgba(255,255,255,0.88)">
    Süreç analiziyle başlayan, ölçeklenebilir ve sürdürülebilir teslimat
  </text>

  <g font-family="system-ui, -apple-system, Segoe UI, Inter, Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.78)">
    <text x="145" y="372">• Operasyon yönetimi ve iş akışı otomasyonu</text>
    <text x="145" y="410">• Kurumsal proje yönetimi ve tek muhatap iletişim</text>
    <text x="145" y="448">• Uzun vadeli teknik destek ve güvenlik odağı</text>
  </g>

  <text x="145" y="525" font-family="system-ui, -apple-system, Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.58)">
    akinkaradas.com.tr
  </text>
</svg>
